# Reusable workflow, intended for use in production deployments
# NOTE: npm publishing uses trusted publishing (OIDC). The workflow filename is part of
# the trusted publisher configuration on npmjs.com, so if this workflow is renamed
# the trusted publisher settings of every published package must be updated too.
name: Semantic release

on:
  workflow_call:
    inputs:
      environment_name:
        description: The Github environment containing all the variables needed
        required: false
        type: string
      enable_npmrc_echo:
        description: Whether to run the .npmrc echo step
        required: false
        type: boolean
        default: false
      enable_artifact_download:
        description: Whether to download the dist folder from artifact
        required: false
        type: boolean
        default: true
      distPath:
        description: The path to the dist folder
        required: false
        type: string
        default: dist
      node_version:
        description: 'The node version to use'
        required: false
        type: string
        default: '24.x'
      fetch_depth:
        description: 'Fetch depth in git'
        required: false
        type: number
        default: 1

jobs:
  release:
    name: Semantic release
    environment: "${{ inputs.environment_name }}"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with: 
          fetch-depth: ${{ inputs.fetch_depth }}
      - name: Download build folder
        if: ${{ inputs.enable_artifact_download }}
        uses: actions/download-artifact@v7
        with:
          name: build
          path: ${{ inputs.distPath }}
      - name: Use Node.js ${{ inputs.node_version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ inputs.node_version }}
          cache: "npm"
      - name: Setup .npmrc
        if: ${{ inputs.enable_npmrc_echo }}
        run: echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > .npmrc
      - name: Install dependencies
        run: npm install
      - name: Semantic release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Remove the .npmrc (written by "Setup .npmrc" for npm install) so semantic-release
          # publishes via trusted publishing instead of the token.
          # TODO: remove `rm -f .npmrc` when the token passed is read-only
          rm -f .npmrc
          npm run semantic-release
